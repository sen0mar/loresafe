packages:
  - "apps/*"

overrides:
  # Prisma 7.8.0 pins the vulnerable 1.19.11 patch through optional CLI tooling.
  # Keep the API-compatible security patch until Prisma bundles it upstream.
  "@hono/node-server": 1.19.13
  # Prisma 7.9.1 and 7.10.0 pin the vulnerable 7.x config-toolchain release.
  # Keep the patched release until Prisma bundles deepmerge-ts 8 upstream.
  deepmerge-ts: 8.0.0
  # Keep transitive URL and IP parsing on their patched API-compatible releases.
  fast-uri: 3.1.9
  ip-address: 10.7.4
  # Prisma CLI tooling pins mysql2; retain its supported major with security fixes.
  mysql2: 3.23.1
  # Express query/body parsing must use the patched 6.x release.
  qs: 6.16.1
  # Patch the existing test tooling's multipart and HTTP clients within their majors.
  form-data: 4.0.6
  undici: 7.30.1
  # Express transport and image/build source maps need patched transitive releases.
  body-parser: 2.4.0
  proxy-addr: 2.0.8
  source-map-js: 1.2.2
  # ESLint/TypeScript tooling pins vulnerable minimatch 10; 11 fixes the advisory
  # and retains the named API consumed by those callers. Verify through lint.
  minimatch: 11.0.1
  brace-expansion: 5.0.12
  # React Hooks lint tooling retains an older Zod through its validation helper.
  zod: 4.6.7
  # Patch the browser-target resolver used by the existing lint tooling.
  browserslist: 4.28.7

allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  # Reviewed types-only patch keeps declarations aligned with the Node 22 runtime.
  - "@types/node@22.20.2"
